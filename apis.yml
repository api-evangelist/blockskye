aid: blockskye
name: Blockskye
description: 'Blockskye is an enterprise travel management and payments platform for
  large corporate travel programs, founded in 2017 and headquartered in New York. It
  combines a consumer-grade online booking tool sourced through direct supplier and
  NDC connectivity, BMAX direct settlement that wires a customer''s ERP straight to
  travel suppliers so booked travel bypasses corporate cards and expense reports, B360
  for capturing personal co-brand card loyalty on business trips while holding policy
  compliance, and real-time reporting across every booking channel, with transactions
  recorded to a tamper-resistant distributed ledger. Blockskye delivers an end-to-end
  corporate travel solution in partnership with KAYAK for Business. The platform is
  sold and operated as an enterprise service: the booking, servicing and settlement
  application runs at horizon.blockskye.com behind a customer login and the knowledge
  base sits behind a Freshworks OAuth login. Blockskye operates a live production API
  host at api.blockskye.com but publishes no public developer portal, API reference,
  or machine-readable API contract.'
