- aid: blockskye:blockskye-api
  name: Blockskye API
  description: 'Live production API host operated by Blockskye, discovered by probe.
    The host answers as a Fastify service behind AWS API Gateway: GET /health returns
    200 with a JSON status/bootId payload, every other probed route returns a structured
    JSON 404 ("Route GET:<path> not found"), and anonymous responses carry X-RateLimit-Limit,
    X-RateLimit-Remaining and X-RateLimit-Reset headers. Blockskye publishes no OpenAPI,
    Swagger, GraphQL or MCP contract for this host and no public API reference — the
    documented surface is customer-only. Recorded here as an observed endpoint, not
    as a published, callable developer API.'
